# ---------------------------------------------------------------------------
# deploy.yml -- CONTINUOUS DEPLOYMENT
# Runs when code is pushed/merged to `main`:
#   1. run tests  ->  2. terraform plan  ->  3. terraform apply  ->  4. smoke test
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, TF_STATE_BUCKET, ALERT_EMAIL
# ---------------------------------------------------------------------------
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual "Run workflow" button

# Never run two deployments at once (would fight over the state file).
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1 # must match aws_region in terraform/variables.tf

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  deploy:
    name: Terraform apply
    needs: test # only deploy if tests pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      # Log in to AWS using the access keys stored as GitHub secrets.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false # so `terraform output -raw` returns clean text

      - name: Terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      # Smoke test: call the live API; the step fails if the API doesn't answer 200.
      - name: Smoke test API
        run: |
          API_URL=$(terraform output -raw api_url)
          echo "Calling $API_URL/visit"
          curl --fail --silent --show-error -X POST "$API_URL/visit"
          echo
          echo "Website: $(terraform output -raw website_url)"
