# ---------------------------------------------------------------------------
# ci.yml -- CONTINUOUS INTEGRATION
# Runs on every pull request and on pushes to any branch except main.
# It checks the code but NEVER touches your AWS account (no secrets used).
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test-python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  terraform-checks:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      # Formatting check: fails if files aren't formatted (fix with `terraform fmt`)
      - run: terraform fmt -check -recursive
      # -backend=false: validate syntax only, don't connect to S3/AWS
      - run: terraform init -backend=false
      - run: terraform validate
        env:
          TF_VAR_alert_email: ci@example.com
